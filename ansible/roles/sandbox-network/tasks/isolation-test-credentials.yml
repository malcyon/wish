---
# One guest's credential audit, included once from isolation-test.yml after
# every guest's network assertions have already reported. `guest` is an entry
# of sandbox_net_probe_guests that defines audit_dirs -- only such a guest
# reaches this file, so audit_dirs is always present here.
#
# Kept out of isolation-test-guest.yml on purpose: that file's probes all
# finish in seconds, and a credential scan across a whole filesystem does not,
# so mixing them into one probe list let a stuck scan hold up the network
# assertions behind it (#644).

- name: "{{ guest.domain }}: no GitHub token in any process environment"
  ansible.builtin.command:
    argv: >-
      {{ ['timeout', '--signal=TERM', '--kill-after=5s', sandbox_net_probe_timeout_seconds | string,
          'ssh', '-o', 'BatchMode=yes', '-o', 'StrictHostKeyChecking=no',
          '-o', 'UserKnownHostsFile=/dev/null', '-o', 'LogLevel=ERROR', '-o', 'ConnectTimeout=10']
         + (['-i', guest.key, '-o', 'IdentitiesOnly=yes'] if guest.key | length else [])
         + [guest.user ~ '@' ~ sandbox_net_leases[guest.domain].ip,
            'sudo sh -c \'cat /proc/[0-9]*/environ\' 2>/dev/null | tr \'\\0\' \'\\n\' | grep -qE \''
              ~ sandbox_net_token_pattern ~ '\'; [ $? -eq 1 ] && echo RC=0 || echo RC=1'] }}
  register: sandbox_net_credential_env
  changed_when: false
  failed_when: false
  check_mode: false
  become: false
  environment:
    SSH_ASKPASS_REQUIRE: never

- name: "Assert {{ guest.domain }} has no GitHub token in any process environment"
  ansible.builtin.assert:
    that:
      - "'RC=0' in sandbox_net_credential_env.stdout"
    fail_msg: >-
      {% if 'RC=0' not in sandbox_net_credential_env.stdout and 'RC=1' not in sandbox_net_credential_env.stdout -%}
      {{ guest.domain }}: the process-environment audit did not run at all (ssh
      exited {{ sandbox_net_credential_env.rc }}:
      {{ sandbox_net_credential_env.stderr | trim }}). This proves nothing
      either way.
      {%- else -%}
      {{ guest.domain }}: a GitHub token is in a process environment.
      {%- endif %}

# One root at a time, so a slow root is visible before it finishes rather than
# only after the whole audit is done.
- name: "{{ guest.domain }}: audit each credential root"
  ansible.builtin.include_tasks: isolation-test-credential-root.yml
  loop: "{{ guest.audit_dirs }}"
  loop_control:
    loop_var: root
    label: "{{ guest.domain }}: {{ root }}"
