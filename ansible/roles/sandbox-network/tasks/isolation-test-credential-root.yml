---
# One credential root of one guest's audit, included once per entry of
# `guest.audit_dirs` with `root` as the loop var. Printed before it runs, since
# this is the one probe in the whole test that is not expected to finish in a
# second or two.
#
# The scan runs as a script over the ssh connection's stdin rather than as a
# one-line remote command, so it can build its own file manifest, tell a
# missing match from a read error, and clean up its temporary file on every
# exit -- including the deadline below cutting it off. It reports only
# filenames it found and counts; it never prints a matching line or a token.
#
# Flatpak hard-links the same object content into both
# `~/.local/share/flatpak/repo/objects` and into `runtime/` and `app/` beside
# it when a package is deployed, so pruning `repo/objects` alone leaves the
# same bytes reachable through `runtime/`. sandbox_net_credential_prune_globs
# prunes the whole of `~/.local/share/flatpak`; per-app state under
# `~/.var/app` is not a Flatpak payload and stays in scope.

- name: "{{ guest.domain }}: about to scan {{ root }} (deadline {{ sandbox_net_credential_root_timeout_seconds }}s)"
  ansible.builtin.debug:
    msg: "{{ guest.domain }}: scanning {{ root }} for a GitHub token, deadline {{ sandbox_net_credential_root_timeout_seconds }}s"

- name: "{{ guest.domain }}: scan {{ root }} for a GitHub token"
  ansible.builtin.command:
    argv: >-
      {{ ['timeout', '--signal=TERM', '--kill-after=5s', sandbox_net_credential_root_timeout_seconds | string,
          'ssh', '-o', 'BatchMode=yes', '-o', 'StrictHostKeyChecking=no',
          '-o', 'UserKnownHostsFile=/dev/null', '-o', 'LogLevel=ERROR', '-o', 'ConnectTimeout=10']
         + (['-i', guest.key, '-o', 'IdentitiesOnly=yes'] if guest.key | length else [])
         + [guest.user ~ '@' ~ sandbox_net_leases[guest.domain].ip, 'sudo bash -s'] }}
    stdin: "{{ sandbox_net_credential_audit_script }}"
  register: sandbox_net_credential_root
  changed_when: false
  failed_when: false
  check_mode: false
  become: false
  environment:
    SSH_ASKPASS_REQUIRE: never
  vars:
    sandbox_net_credential_audit_script: |
      set -u
      prune=(
      {% for g in sandbox_net_credential_prune_globs %}
        {{ g | quote }}
      {% endfor %}
      )
      pruneargs=()
      for p in "${prune[@]}"; do
        pruneargs+=(-path "$p" -prune -o)
      done
      manifest=$(mktemp)
      trap 'rm -f "$manifest"' EXIT
      find_rc=0
      find {{ root | quote }} -xdev "${pruneargs[@]}" -type f -print0 >"$manifest" 2>/dev/null || find_rc=$?
      scanned=0
      matched=0
      errors=0
      special=0
      while IFS= read -r -d '' f; do
        if [ -L "$f" ] || [ ! -f "$f" ]; then
          special=$((special + 1))
          continue
        fi
        scanned=$((scanned + 1))
        grep -IlE {{ sandbox_net_token_pattern | quote }} "$f" >/dev/null 2>/dev/null
        rc=$?
        if [ "$rc" -eq 0 ]; then
          matched=$((matched + 1))
          echo "MATCH $f"
        elif [ "$rc" -eq 2 ]; then
          errors=$((errors + 1))
          echo "ERROR $f"
        fi
      done <"$manifest"
      echo "COUNTS root={{ root }} scanned=$scanned matched=$matched errors=$errors special=$special find_rc=$find_rc"
      if [ "$find_rc" -ne 0 ] || [ "$errors" -gt 0 ]; then
        echo "AUDIT=INCOMPLETE"
      elif [ "$matched" -gt 0 ]; then
        echo "AUDIT=FOUND"
      else
        echo "AUDIT=CLEAN"
      fi

# Anything but a clean, complete scan fails, and none of these can satisfy the
# assertion by accident: a timeout (rc=124), a missing root, a `find` error, a
# grep read error, and a run that never reached its final marker are all
# reported incomplete rather than passed or silently ignored.
- name: "Assert {{ guest.domain }} has no GitHub token under {{ root }}"
  ansible.builtin.assert:
    that:
      - "'AUDIT=CLEAN' in sandbox_net_credential_root.stdout"
    fail_msg: >-
      {% if 'AUDIT=' not in sandbox_net_credential_root.stdout -%}
      {{ guest.domain }}: the audit of {{ root }} did not run at all or did not
      finish (ssh exited {{ sandbox_net_credential_root.rc }}:
      {{ sandbox_net_credential_root.stderr | trim }}). This proves nothing
      either way and does not count as tested.
      {%- elif 'AUDIT=FOUND' in sandbox_net_credential_root.stdout -%}
      {{ guest.domain }}: a file under {{ root }} matches the GitHub token
      pattern. {{ sandbox_net_credential_root.stdout_lines | select('match', '^COUNTS') | list | join(' ') }}
      {%- else -%}
      {{ guest.domain }}: the audit of {{ root }} was incomplete (a directory or
      file could not be read), so it is not a pass.
      {{ sandbox_net_credential_root.stdout_lines | select('match', '^COUNTS') | list | join(' ') }}
      {%- endif %}
