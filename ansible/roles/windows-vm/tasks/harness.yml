---
# Keeps a running Windows guest's WinUAE harness the repository's committed
# copy: the files in winvm_amiga_harness_files, the folders in
# winvm_amiga_dirs, the Defender exclusions, and no scheduled task left from a
# deleted verb (winvm_amiga_stale_tasks). Everything in the guest goes through
# the `winvm` this role installs, as the account running the playbook, whose
# key the guest trusts; root has none of those keys.
#
# A guest that is off is skipped with a message. A running guest that does not
# answer ssh, or whose first-logon log does not end with its done line, fails
# the run when the `winvm_harness` tag was asked for, and is skipped with the
# reason otherwise.
#
# Under --check the survey still runs, since it only reads, and lists what a
# real run would change; nothing is copied.

# From HEAD, not the working tree, so a file half way through an edit never
# reaches the guest. Extracted on the controller into a directory removed below.
- name: Make a directory for the committed harness files
  ansible.builtin.tempfile:
    state: directory
    suffix: .winvm-harness
  register: winvm_harness_tmp
  delegate_to: localhost
  become: false
  check_mode: false

- name: Stage the committed harness files
  block:
    - name: Export the committed harness files from git
      ansible.builtin.command:
        argv: >-
          {{ ['git', '-C', winvm_repo_dir, 'archive', '--format=tar',
              '-o', winvm_harness_tmp.path ~ '/harness.tar', 'HEAD', '--']
             + (winvm_amiga_harness_files | map(attribute='src') | map('regex_replace', '^', 'tools/amiga/') | list) }}
      delegate_to: localhost
      become: false
      changed_when: false
      check_mode: false

    - name: Unpack the committed harness files
      ansible.builtin.unarchive:
        src: "{{ winvm_harness_tmp.path }}/harness.tar"
        dest: "{{ winvm_harness_tmp.path }}"
        remote_src: true
      delegate_to: localhost
      become: false
      changed_when: false
      check_mode: false

    - name: Hash the committed harness files
      ansible.builtin.stat:
        path: "{{ winvm_harness_tmp.path }}/tools/amiga/{{ item.src }}"
        get_checksum: true
        checksum_algorithm: sha256
      loop: "{{ winvm_amiga_harness_files }}"
      loop_control:
        label: "{{ item.src }}"
      delegate_to: localhost
      become: false
      register: winvm_harness_local

    - name: Create the host's harness staging directory
      ansible.builtin.file:
        path: "{{ winvm_harness_stage_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Stage the committed harness files for a running guest
      ansible.builtin.copy:
        src: "{{ winvm_harness_tmp.path }}/tools/amiga/{{ item.src }}"
        dest: "{{ winvm_harness_stage_dir }}/{{ item.src }}"
        owner: root
        group: root
        mode: "0644"
      loop: "{{ winvm_amiga_harness_files }}"
      loop_control:
        label: "{{ item.src }}"
  always:
    - name: Remove the directory the committed files were exported to
      ansible.builtin.file:
        path: "{{ winvm_harness_tmp.path }}"
        state: absent
      delegate_to: localhost
      become: false
      check_mode: false

# An undefined domain is a guest not built yet; any other virsh error fails.
- name: Check the Windows guest is running
  ansible.builtin.command:
    argv: [virsh, -c, "qemu:///system", domstate, "{{ winvm_name }}"]
  register: winvm_harness_state
  changed_when: false
  failed_when:
    - winvm_harness_state.rc != 0
    - "'failed to get domain' not in winvm_harness_state.stderr"
  check_mode: false

- name: Note whether the guest is running
  ansible.builtin.set_fact:
    winvm_harness_running: "{{ winvm_harness_state.rc == 0 and winvm_harness_state.stdout | trim == 'running' }}"
    winvm_harness_asked: "{{ 'winvm_harness' in ansible_run_tags }}"

# Also reads the first-logon log: sshd answers before guest-setup.ps1 has
# finished, and its own harness copy must not race this one. A log that is
# absent, or whose last line is the end of a run, means it is not running.
- name: Check the Windows guest answers ssh and has finished its first-logon script
  ansible.builtin.command:
    argv:
      - timeout
      - "60"
      - /usr/local/bin/winvm
      - ssh
      - >-
        powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -EncodedCommand
        {{ winvm_harness_probe | b64encode(encoding='utf-16-le') }}
  vars:
    winvm_harness_probe: |
      $log = 'C:\Windows\Temp\guest-setup.log'
      $missing = -not (Test-Path -LiteralPath $log)
      $last = ''
      if (-not $missing) {
        try { $last = [string](Get-Content -LiteralPath $log -Tail 1 -ErrorAction Stop) } catch { $last = 'SETUP running: log unreadable' }
      }
      $written = if ($missing) { 'no log' } else { (Get-Item -LiteralPath $log).LastWriteTimeUtc.ToString('yyyy-MM-dd HH:mm:ss') + ' UTC' }
      "LOGWRITTEN $written"
      if ($missing -or $last.Contains('{{ winvm_guest_setup_done_marker }}') -or $last -match 'FAIL  install WinUAE harness files') {
        'SETUP finished'
      } elseif ($last -eq 'SETUP running: log unreadable') {
        $last
      } else {
        "SETUP running: $last"
      }
  register: winvm_harness_ssh
  changed_when: false
  failed_when: false
  check_mode: false
  become: false
  environment:
    SSH_ASKPASS_REQUIRE: never
  when: winvm_harness_running

- name: Note whether the guest can be updated
  ansible.builtin.set_fact:
    winvm_harness_ssh_ok: >-
      {{ winvm_harness_running and winvm_harness_ssh.rc | default(1) == 0
         and (winvm_harness_ssh.stdout_lines | default([]) | select('match', '^SETUP ') | list | length > 0) }}
    winvm_harness_ready: >-
      {{ winvm_harness_running and winvm_harness_ssh.rc | default(1) == 0
         and 'SETUP finished' in winvm_harness_ssh.stdout_lines | default([]) }}
    winvm_harness_log_written: >-
      {{ (winvm_harness_ssh.stdout_lines | default([]) | select('match', '^LOGWRITTEN ') | list | first | default('LOGWRITTEN unknown'))
         | replace('LOGWRITTEN ', '') }}

- name: Stop on a running guest that ssh cannot reach, when the harness was asked for
  ansible.builtin.fail:
    msg: >-
      {{ winvm_name }} is running, but `winvm ssh` failed (exit
      {{ winvm_harness_ssh.rc | default('none') }}:
      {{ winvm_harness_ssh.stderr | default('') | trim | default('no output', true) }}), so
      the WinUAE harness was not updated.
  when:
    - winvm_harness_running
    - not winvm_harness_ssh_ok
    - winvm_harness_asked

- name: Stop on a first-logon script that has not finished, when the harness was asked for
  ansible.builtin.fail:
    msg: >-
      {{ winvm_name }} is running, but C:\Windows\Temp\guest-setup.log does not end with
      "{{ winvm_guest_setup_done_marker }}"
      ({{ winvm_harness_ssh.stdout_lines | select('match', '^SETUP ') | first }};
      log last written {{ winvm_harness_log_written }}), so the WinUAE harness was not updated.
  when:
    - winvm_harness_ssh_ok
    - not winvm_harness_ready
    - winvm_harness_asked

- name: Say why the running guest's harness was not updated
  ansible.builtin.debug:
    msg: >-
      {{ winvm_name }} {{ winvm_harness_why }}, so the WinUAE harness in the
      guest was left as it is. A new guest installs it at first logon; for one
      that already exists, start it with `winvm up` and run this playbook again
      with `--tags winvm_harness`.
  vars:
    winvm_harness_why: >-
      {{ ('is ' ~ (winvm_harness_state.stdout | trim) if winvm_harness_state.rc == 0 else 'is not defined')
         if not winvm_harness_running
         else ('is still running its first-logon script ('
               ~ (winvm_harness_ssh.stdout_lines | select('match', '^SETUP ') | first)
               ~ '; log last written ' ~ winvm_harness_log_written ~ ')'
               if winvm_harness_ssh_ok
               else 'is running, but `winvm ssh` failed (exit ' ~ (winvm_harness_ssh.rc | default('none'))
                    ~ ': ' ~ (winvm_harness_ssh.stderr | default('') | trim | default('no output', true)) ~ ')') }}
  when: not winvm_harness_ready

- name: Update the running guest's harness
  when: winvm_harness_ready
  vars:
    winvm_harness_want: >-
      {{ dict(winvm_harness_local.results
              | map(attribute='item.src')
              | zip(winvm_harness_local.results | map(attribute='stat.checksum') | map('upper'))) }}
    winvm_harness_ps_prelude: |
      $ErrorActionPreference = 'Stop'
      $ProgressPreference = 'SilentlyContinue'
      $files = @(
      {% for f in winvm_amiga_harness_files %}
        @{ src = '{{ f.src }}'; dst = '{{ f.dest }}'; sha = '{{ winvm_harness_want[f.src] }}' }
      {% endfor %}
      )
      $dirs = @(
      {% for d in winvm_amiga_dirs %}
        '{{ d }}'
      {% endfor %}
      )
      $exclusions = @(
      {% for e in winvm_defender_exclusions %}
        '{{ e }}'
      {% endfor %}
      )
      $staleTasks = @(
      {% for t in winvm_amiga_stale_tasks %}
        '{{ t }}'
      {% endfor %}
      )
      function Hash-Of($p) {
        if (Test-Path -LiteralPath $p -PathType Leaf) { (Get-FileHash -Algorithm SHA256 -LiteralPath $p).Hash } else { 'MISSING' }
      }
  block:
    # Read-only: prints one line for each thing a real run would change.
    - name: Survey the guest's harness files, folders, Defender exclusions and stale tasks
      ansible.builtin.command:
        argv:
          - timeout
          - "120"
          - /usr/local/bin/winvm
          - ssh
          - >-
            powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -EncodedCommand
            {{ winvm_harness_survey | b64encode(encoding='utf-16-le') }}
      vars:
        winvm_harness_survey: |
          {{ winvm_harness_ps_prelude }}
          foreach ($f in $files) {
            $have = Hash-Of $f.dst
            if ($have -ne $f.sha) { "STALE $($f.src)"; "  $($f.dst) is $have, the repository's is $($f.sha)" }
          }
          foreach ($d in $dirs) { if (-not (Test-Path -LiteralPath $d -PathType Container)) { "NODIR $d" } }
          $have = @((Get-MpPreference).ExclusionPath)
          foreach ($e in $exclusions) { if ($have -notcontains $e) { "NOEXCL $e" } }
          foreach ($t in $staleTasks) { if (Get-ScheduledTask -TaskName $t -ErrorAction SilentlyContinue) { "OLDTASK $t" } }
          'SURVEYED'
      register: winvm_harness_survey_out
      changed_when: false
      failed_when: >-
        winvm_harness_survey_out.rc != 0
        or 'SURVEYED' not in winvm_harness_survey_out.stdout_lines
      check_mode: false
      become: false
      environment:
        SSH_ASKPASS_REQUIRE: never

    - name: Work out what the guest lacks
      ansible.builtin.set_fact:
        winvm_harness_stale: >-
          {{ winvm_harness_survey_out.stdout_lines | select('match', '^STALE ')
             | map('replace', 'STALE ', '') | list }}
        winvm_harness_setup_needed: >-
          {{ winvm_harness_survey_out.stdout_lines | select('match', '^(NODIR|NOEXCL|OLDTASK) ') | list | length > 0 }}

    - name: List what the guest lacks
      ansible.builtin.debug:
        msg: "{{ winvm_harness_survey_out.stdout_lines | reject('equalto', 'SURVEYED') | list }}"
      when: winvm_harness_stale | length > 0 or winvm_harness_setup_needed

    - name: Create the harness folders and Defender exclusions, and remove stale tasks, in the guest
      ansible.builtin.command:
        argv:
          - timeout
          - "120"
          - /usr/local/bin/winvm
          - ssh
          - >-
            powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -EncodedCommand
            {{ winvm_harness_setup | b64encode(encoding='utf-16-le') }}
      vars:
        winvm_harness_setup: |
          {{ winvm_harness_ps_prelude }}
          foreach ($d in $dirs) { New-Item -ItemType Directory -Force -Path $d | Out-Null }
          $have = @((Get-MpPreference).ExclusionPath)
          foreach ($e in $exclusions) { if ($have -notcontains $e) { Add-MpPreference -ExclusionPath $e } }
          $have = @((Get-MpPreference).ExclusionPath)
          foreach ($e in $exclusions) { if ($have -notcontains $e) { throw "Defender exclusion not set: $e" } }
          foreach ($t in $staleTasks) {
            if (Get-ScheduledTask -TaskName $t -ErrorAction SilentlyContinue) { Unregister-ScheduledTask -TaskName $t -Confirm:$false }
            if (Get-ScheduledTask -TaskName $t -ErrorAction SilentlyContinue) { throw "scheduled task still registered: $t" }
          }
          'DONE'
      register: winvm_harness_setup_out
      changed_when: true
      failed_when: >-
        winvm_harness_setup_out.rc != 0
        or 'DONE' not in winvm_harness_setup_out.stdout_lines
      when: winvm_harness_setup_needed
      become: false
      environment:
        SSH_ASKPASS_REQUIRE: never

    # Copied beside the destination under a temporary name first, so a tool
    # starting meanwhile never reads a half-written driver.
    - name: Copy each changed harness file to the guest
      ansible.builtin.command:
        argv:
          - timeout
          - "120"
          - /usr/local/bin/winvm
          - scp
          - "{{ winvm_harness_stage_dir }}/{{ item.src }}"
          - >-
            {{ winvm_admin_user }}@{{ winvm_ip }}:{{ (item.dest ~ '.deploy') | replace(winvm_harness_backslash, '/') }}
      vars:
        # A variable, not a literal: Ansible doubles a backslash written inside
        # a template's string literal, and scp wants forward slashes.
        winvm_harness_backslash: '\'
      loop: "{{ winvm_amiga_harness_files }}"
      loop_control:
        label: "{{ item.src }}"
      when: item.src in winvm_harness_stale
      changed_when: true
      become: false
      environment:
        SSH_ASKPASS_REQUIRE: never

    - name: Put the changed harness files in place and check their hashes
      ansible.builtin.command:
        argv:
          - timeout
          - "120"
          - /usr/local/bin/winvm
          - ssh
          - >-
            powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -EncodedCommand
            {{ winvm_harness_place | b64encode(encoding='utf-16-le') }}
      vars:
        winvm_harness_place: |
          {{ winvm_harness_ps_prelude }}
          $stale = @(
          {% for s in winvm_harness_stale %}
            '{{ s }}'
          {% endfor %}
          )
          foreach ($f in $files) {
            if ($stale -notcontains $f.src) { continue }
            $tmp = "$($f.dst).deploy"
            if ((Hash-Of $tmp) -ne $f.sha) { throw "the copy of $($f.src) at $tmp does not hash to $($f.sha)" }
            if (Test-Path -LiteralPath $f.dst) { [IO.File]::Replace($tmp, $f.dst, [NullString]::Value) } else { [IO.File]::Move($tmp, $f.dst) }
            if ((Hash-Of $f.dst) -ne $f.sha) { throw "$($f.dst) does not hash to $($f.sha) after the copy" }
            "deployed $($f.dst) SHA256 $($f.sha)"
          }
          'DONE'
      register: winvm_harness_place_out
      changed_when: true
      failed_when: >-
        winvm_harness_place_out.rc != 0
        or 'DONE' not in winvm_harness_place_out.stdout_lines
      when: winvm_harness_stale | length > 0
      become: false
      environment:
        SSH_ASKPASS_REQUIRE: never
