# The proposed DOS-to-C64 combat-figure table for #130 (A converted DOS
# party arrives with six identical combat figures, not its own).
#
# This is the single source: edit `c64:` and `alt:` here, never in the
# generated document. Regenerate it with:
#
#     tools/iconproposal.py --markdown work/issue130/proposal/proposal.md
#
# `c64` is the proposed C64 option number, `alt` (when present) lists any
# other option that looked as close, and the trailing comment names what the
# DOS figure shows -- read off the sheets at work/issue130/big-*.png, not
# measured.

# DOS body n -> C64 large weapon option. The C64's small list is the same 28
# designs in the same order (18 of 28 share their weapon glyphs exactly and
# the other ten differ only in the shield glyph the smaller body wears), so
# one table serves both sizes; an option at or above 28 on a small character
# is composed as a large weapon under a small head, which the game accepts
# (HOGARTH's icon on the player's own disks is such a mix).
weapons:
  0:  {c64: 0}         
  1:  {c64: 26}        
  2:  {c64: 10}            
  3:  {c64: 23}                 
  4:  {c64: 24}               
  5:  {c64: 21}           
  6:  {c64: 27}      
  7:  {c64: 1}                
  8:  {c64: 8}            
  9:  {c64: 27}                
  10: {c64: 5}                    
  11: {c64: 25}          
  12: {c64: 5}        
  13: {c64: 5}         
  14: {c64: 5}         
  15: {c64: 27}            
  16: {c64: 28}              
  17: {c64: 2}            
  18: {c64: 11}      
  19: {c64: 13}  
  20: {c64: 12}        
  21: {c64: 3}    
  22: {c64: 17}                    
  23: {c64: 6}       
  24: {c64: 3}                       
  25: {c64: 9}           
  26: {c64: 20}    
  27: {c64: 34}      
  28: {c64: 31}          
  29: {c64: 32}      
  30: {c64: 33}              
  31: {c64: 30}       

# DOS head n -> C64 large head option. The C64 small list is 14 heads and its
# large list 23; the DOS small heads are the large designs eight rows tall
# instead of ten. These rows are the least certain of the three tables: a
# head is two cells of art on the C64 and ten rows on DOS, and half of them
# differ by one band of pixels.
heads:
  0:  {c64: 5}    
  1:  {c64: 2}    
  2:  {c64: 21}   
  3:  {c64: 3}        
  4:  {c64: 2} 
  5:  {c64: 1}                  
  6:  {c64: 2}  
  7:  {c64: 9}          
  8:  {c64: 17}  
  9:  {c64: 4}      
  10: {c64: 15}       
  11: {c64: 6}             
  12: {c64: 13}     
  13: {c64: 7}  

# EGA index -> C64 colour 0-7, the proposal of the colour comment on the
# issue. Four of these are not the nearest colour by RGB: brown to yellow,
# light grey to white, dark grey to black and light red to red.
colours:
  0:  {c64: 0}                        # black
  1:  {c64: 6}                        # blue
  2:  {c64: 5}                        # green
  3:  {c64: 3}                        # cyan
  4:  {c64: 2}                        # red
  5:  {c64: 4}                        # magenta -> purple
  6:  {c64: 7}                        # brown -> yellow
  7:  {c64: 1}                        # light grey -> white
  8:  {c64: 0}                        # dark grey -> black
  9:  {c64: 6}                        # light blue -> blue
  10: {c64: 5}                        # light green -> green
  11: {c64: 3}                        # light cyan -> cyan
  12: {c64: 2}                        # light red -> red
  13: {c64: 4}                        # light magenta -> purple
  14: {c64: 7}                        # yellow
  15: {c64: 1}                        # white

# Per-title overrides (#330, #335). Curse of the Azure Bonds ships the
# identical art in every row above and never appears here; a title appears
# only where it actually redrew a DOS option's art, and holds only that row.
#
# Shape, one section per title key, each holding "weapons" and/or "heads"
# exactly like the tables above:
#
#   overrides:
#     secret-of-the-silver-blades:
#       heads:
#         10: {c64: ...}   # large head 10 -- Silver Blades draws a hat
#                          # here that Pool of Radiance's does not
#       weapons:
#         11: {c64: ...}   # small body 11 -- Silver Blades draws no
#                          # weapon where Pool of Radiance's draws one
#
# Donald picked the head on 2026-09-05; the body is still open on #335.
overrides:
  secret-of-the-silver-blades:
    heads:
      10: {c64: 2}         # Silver Blades draws a hat on this head where
                           # Pool of Radiance draws a bare one, so it wants
                           # a C64 head that wears something rather than
                           # head 15, which is hair and nothing on top.
                           # Donald, 2026-09-05: "The #10 DOS head should be
                           # matched with the #2 C64 head."
