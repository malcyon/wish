name: issue origin

# Two triggers, and neither ever removes a label.
#
# `issues: opened` says who built the ticket. `issue_comment: created` says
# somebody outside the project is talking in it -- which is the thing a visitor
# wants to see and the thing an agent needs, since an agent does not comment on
# a `human` thread.
#
# Adding only, never removing, never on `labeled`/`unlabeled`: a workflow that
# re-asserts a label reverses a person's edit, which `.claude/rules/issues.md`
# forbids and which nobody can argue with in a comment. Donald can take either
# label off and it stays off.
on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  issues: write

jobs:
  classify:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest

    steps:
      - name: Label by author
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A wrong login here does not fail the job: it takes the `else`
          # branch and labels every one of the bot's issues `human`.
          BOT_LOGIN: wish-agent[bot]
          # Read through the environment, never interpolated into `run:` --
          # `${{ }}` is substituted into the shell source before bash sees it.
          AUTHOR: ${{ github.event.issue.user.login }}
          NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # The removal must not be able to fail the add: a new issue carries
          # neither label, so it targets an absent one on every ordinary run.
          if [ "$AUTHOR" = "$BOT_LOGIN" ]; then
            gh issue edit "$NUMBER" --repo "$REPO" --add-label "AI"
            gh issue edit "$NUMBER" --repo "$REPO" --remove-label "human" || true
          else
            gh issue edit "$NUMBER" --repo "$REPO" --add-label "human"
            gh issue edit "$NUMBER" --repo "$REPO" --remove-label "AI" || true
          fi

  discussion:
    # Not a pull request: `issue_comment` fires for both, and the two labels
    # describe issues.
    if: github.event_name == 'issue_comment' && !github.event.issue.pull_request
    runs-on: ubuntu-latest

    steps:
      - name: Mark a thread an outside account is talking in
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A webhook payload spells an App the REST way, `wish-agent[bot]` --
          # unlike `gh`, which reports the same account as `app/wish-agent` on
          # a `view` and bare `wish-agent` on a comment. Measured 2026-09-11.
          OWNER: malcyon
          BOT_LOGIN: wish-agent[bot]
          COMMENTER: ${{ github.event.comment.user.login }}
          NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$COMMENTER" = "$OWNER" ] || [ "$COMMENTER" = "$BOT_LOGIN" ]; then
            exit 0
          fi
          # Adding a label the issue already has is a question nobody has
          # answered, and a job that fails on every second comment is noise.
          # Asking first costs one call and settles it.
          if gh issue view "$NUMBER" --repo "$REPO" --json labels \
               -q 'any(.labels[]; .name == "human")' | grep -qx true; then
            exit 0
          fi
          gh issue edit "$NUMBER" --repo "$REPO" --add-label "human"
