name: test

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  # Manual and reusable runs cover every supported combination.
  workflow_dispatch:
  # release.yml calls this before it builds anything: a red suite must stop a
  # tag, and duplicating the matrix there would be a second thing to keep in
  # step with this one.
  workflow_call:
    inputs:
      full-matrix:
        type: boolean
        default: true

# Main and called release runs have unique groups so every commit can finish.
concurrency:
  group: test-${{ github.workflow }}-${{ github.event_name }}-${{ github.workflow == 'test' && (github.event_name == 'push' || github.event_name == 'pull_request') && github.ref_type == 'branch' && github.ref != 'refs/heads/main' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.workflow == 'test' && (github.event_name == 'push' || github.event_name == 'pull_request') && github.ref_type == 'branch' && github.ref != 'refs/heads/main' }}

jobs:
  route:
    # Classification needs complete push history, but no Python environment.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    name: Classify test route
    runs-on: ubuntu-latest
    outputs:
      route: ${{ steps.classify.outputs.route }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Classify the complete push
        id: classify
        shell: bash
        run: |
          python tools/suite/ci_route.py ${{ (inputs.full-matrix || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '--force-full' || '' }} > "$RUNNER_TEMP/ci-route.json"
          cat "$RUNNER_TEMP/ci-route.json"
          route=$(python -c 'import json, os; print(json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "ci-route.json")))["route"])')
          echo "route=$route" >> "$GITHUB_OUTPUT"

  pytest:
    name: pytest (${{ matrix.os }}, py${{ matrix.python }}${{ matrix.shard_label }})
    needs: route
    if: needs.route.outputs.route == 'full'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON((inputs.full-matrix || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '[{"os":"ubuntu-latest","python":"3.12"},{"os":"ubuntu-latest","python":"3.13"},{"os":"windows-latest","python":"3.12"},{"os":"windows-latest","python":"3.13"}]' || '[{"os":"ubuntu-latest","python":"3.12","sharded":true,"shard_index":0,"shard_label":", shard 1/4","artifact_suffix":"-shard-1"},{"os":"ubuntu-latest","python":"3.12","sharded":true,"shard_index":1,"shard_label":", shard 2/4","artifact_suffix":"-shard-2"},{"os":"ubuntu-latest","python":"3.12","sharded":true,"shard_index":2,"shard_label":", shard 3/4","artifact_suffix":"-shard-3"},{"os":"ubuntu-latest","python":"3.12","sharded":true,"shard_index":3,"shard_label":", shard 4/4","artifact_suffix":"-shard-4"},{"os":"windows-latest","python":"3.13","sharded":true,"shard_index":0,"shard_label":", shard 1/4","artifact_suffix":"-shard-1"},{"os":"windows-latest","python":"3.13","sharded":true,"shard_index":1,"shard_label":", shard 2/4","artifact_suffix":"-shard-2"},{"os":"windows-latest","python":"3.13","sharded":true,"shard_index":2,"shard_label":", shard 3/4","artifact_suffix":"-shard-3"},{"os":"windows-latest","python":"3.13","sharded":true,"shard_index":3,"shard_label":", shard 4/4","artifact_suffix":"-shard-4"}]') }}

    steps:
      - uses: actions/checkout@v5
        with:
          # hatch-vcs reads the tag, so the whole history has to be here.
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # The PyQt6 wheel carries Qt but not the X and GL libraries Qt links
      # against, and the runner image has no desktop.
      - name: Qt's system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libglib2.0-0

      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev,gui]" psutil

      - name: pytest
        # Disk-backed tests skip without the player's private game disks.
        # Push/PR runs omit generated checks covered by the separate required job.
        env:
          QT_QPA_PLATFORM: offscreen
          WISH_CI_PRIOR_FAILURES_JSON: ${{ vars.WISH_CI_PRIOR_FAILURES_JSON }}
        run: >-
          python tools/suite/ci_measure.py --output "${{ runner.temp }}/ci-profile"
          ${{ matrix.sharded && format('--shard-index {0} --shard-count 4 --weights tools/suite/ci_weights.json --weight-key {1}-py{2}', matrix.shard_index, matrix.os, matrix.python) || '' }} --
          -q ${{ !(inputs.full-matrix || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '--ignore=tests/generate/test_generated.py' || '' }}

      - name: Test timings and resource measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-profile-${{ matrix.os }}-py${{ matrix.python }}${{ matrix.artifact_suffix }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-profile/
          retention-days: 14
          if-no-files-found: error

  generated:
    # Same-repository branches are tested by push; fork PRs need this run.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    name: generated files match their sources
    needs: route
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Qt's system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libglib2.0-0

      - run: pip install -e ".[dev,gui]"

      - name: Repository policy and generated files
        env:
          QT_QPA_PLATFORM: offscreen
        run: >-
          pytest -q -n0 tests/suite/test_repository_contents.py
          tests/suite/test_toolpaths.py tests/generate/test_generated.py

      - name: Documentation references and recorded boot timing
        if: needs.route.outputs.route == 'docs'
        env:
          QT_QPA_PLATFORM: offscreen
        run: >-
          pytest -q -n0 tests/suite/test_toolreadmes.py
          tests/generate/test_genimports.py
          tests/c64/test_session_boot.py::test_the_play_game_wait_covers_the_measured_stock_boot_twice_over

  documentation:
    name: documentation-only validation
    needs: [route, generated]
    if: needs.route.outputs.route == 'docs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verify the docs route at this commit
        run: python tools/suite/ci_route.py --require-docs
