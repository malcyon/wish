name: test

on:
  push:
  pull_request:

jobs:
  pytest:
    name: pytest (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5
        with:
          # hatch-vcs reads the tag, so the whole history has to be here.
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # The PyQt6 wheel carries Qt but not the X and GL libraries Qt links
      # against, and the runner image has no desktop.
      - name: Qt's system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libglib2.0-0

      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev,gui]"

      - name: pytest
        # Around thirty tests need the player's game disks, which are
        # deliberately not in this repository. They skip; that is expected.
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

  generated:
    name: generated files match their sources
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Qt's system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libglib2.0-0

      - run: pip install -e ".[dev,gui]"

      - name: the compiled form matches character.ui
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/genui.py --check

      - name: the generated docs match the code
        run: |
          python tools/gendocs.py
          python tools/genmemory.py
          git diff --exit-code -- docs/
