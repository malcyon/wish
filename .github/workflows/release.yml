name: release

on:
  push:
    tags:
      - "v*"
  # Build the artefacts without cutting a release. PyInstaller cannot
  # cross-compile -- it bundles the interpreter it is running on -- so a
  # Windows build has to happen on Windows, and this is the cheapest Windows
  # this project has. Run it from the Actions tab, then download the
  # `frozen-windows` artefact and copy it to the laptop.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # The whole suite, on both platforms, before a tag builds anything. Until
  # this was here a red test.yml did not stop a release.
  tests:
    uses: ./.github/workflows/test.yml

  dist:
    name: the wheel
    needs: [tests]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install build
      - run: python -m build

      - name: the version is the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: python -c "import glob,sys; v='${{ github.ref_name }}'[1:]; f=glob.glob('dist/*.whl')[0]; sys.exit(0 if f.split('-')[1] == v else f'{f} is not version {v}')"

      # Both, because PyPI wants the sdist. Only the wheel reaches the GitHub
      # release page: GitHub attaches its own "Source code (zip)" and "Source
      # code (tar.gz)" to every release and those cannot be renamed, so ours
      # as well would put three source-looking downloads on one page.
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  frozen:
    name: ${{ matrix.label }} build
    needs: [tests]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux
          - os: windows-latest
            label: windows

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Qt's system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libglib2.0-0

      # The editable install is what writes wish/_version.py from the tag, and
      # that file is how the frozen build knows what it is.
      - run: pip install -e ".[gui]" pyinstaller

      - run: pyinstaller --noconfirm wish.spec

      # The artefact used to ship having never been started, and then to ship
      # having printed nothing: an exit code of 0 was all this asserted, and a
      # windowed Windows build with no stdout exits 0 in silence. Assert the
      # output. `--version` exits inside argparse, before Qt is imported, so
      # none of this needs a display. See packaging/wish_main.py.
      # On a tag the version is the tag; on a manual run hatch-vcs makes a dev
      # version, and the check is still worth making -- it is the executable
      # printing anything at all that has broken before now.
      - name: the version to expect
        shell: bash
        run: echo "VERSION=$(python -c 'from wish import __version__; print(__version__)')" >> "$GITHUB_ENV"

      - name: it starts, and says which version it is
        shell: bash
        run: |
          set -euo pipefail
          [ "$RUNNER_OS" = Windows ] && exe=dist/wish/wish.exe || exe=dist/wish/wish
          want="wish $VERSION"
          got=$("$exe" --version 2>&1 | tr -d '\r')
          echo "$exe --version -> ${got:-(nothing)}"
          [ "$got" = "$want" ] || { echo "expected: $want"; exit 1; }

      # The same silence swallowed every diagnostic, including the "no game
      # disks ... so the map tab will be empty" line, which is the one message
      # a first-time user with the disks in the wrong place needs. argparse's
      # own error is the cheapest thing that travels the identical path and
      # does not open a window.
      - name: and its errors reach the terminal
        shell: bash
        run: |
          # `set +e` and not `set -uo pipefail`: GitHub already runs bash with
          # `-e`, so dropping it from `set` here does nothing and the step dies
          # on argparse's exit 2 before it can look at what was printed --
          # which is the whole assertion.
          set +e
          [ "$RUNNER_OS" = Windows ] && exe=dist/wish/wish.exe || exe=dist/wish/wish
          got=$("$exe" --no-such-option 2>&1 | tr -d '\r')
          echo "$exe --no-such-option -> ${got:-(nothing)}"
          case "$got" in
            *"unrecognized arguments"*) ;;
            *) echo "argparse's error never reached us"; exit 1 ;;
          esac

      # One executable on both platforms since 129-one-binary.md, where
      # `wish-cli` became `wish export` and `wish import`. This used to be the
      # platform split -- "the CLI ships on Linux and only on Linux" -- and the
      # split is what the last packaging bug lived in. Asserted by counting,
      # not by name, so a second EXE creeping back into wish.spec under any
      # name is caught. Pure bash: Git Bash on the Windows runner has `find`,
      # but a glob needs nothing at all.
      - name: there is exactly one executable
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=()
          for f in dist/wish/*; do [ -f "$f" ] && files+=("$f"); done
          printf '%s\n' "${files[@]}"
          [ "${#files[@]}" = 1 ] || {
            echo "expected one executable beside _internal/, got ${#files[@]}"
            exit 1; }

      # The subcommands are the half of the merge a `--version` cannot see:
      # `tools.wish` is reached by an import inside main() that PyInstaller
      # cannot follow, so it is a hiddenimport in wish.spec and a missing one
      # is a ModuleNotFoundError on a user's machine. `--help` exits inside
      # argparse, opens no window and needs no save disk.
      #
      # On Windows the build is windowed, so this only prints at all through
      # the console-borrowing path in packaging/wish_main.py -- which the
      # runner's redirect exercises. Nobody is expected to use the command line
      # on Windows; the assertion is that the code is there and runs.
      - name: and it carries the subcommands
        shell: bash
        run: |
          set -euo pipefail
          [ "$RUNNER_OS" = Windows ] && exe=dist/wish/wish.exe || exe=dist/wish/wish
          got=$("$exe" export --help 2>&1 | tr -d '\r')
          echo "$got"
          case "$got" in
            *"usage: wish export"*) ;;
            *) echo "wish export --help printed nothing useful"; exit 1 ;;
          esac

      - name: name it after the version
        shell: bash
        run: echo "NAME=wish-$VERSION-${{ matrix.label }}-x86_64" >> "$GITHUB_ENV"

      - name: tar.gz
        if: runner.os == 'Linux'
        run: |
          mv dist/wish "dist/$NAME"
          tar -C dist -czf "$NAME.tar.gz" "$NAME"

      - name: zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Move-Item dist/wish "dist/$env:NAME"
          Compress-Archive -Path "dist/$env:NAME" -DestinationPath "$env:NAME.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: frozen-${{ matrix.label }}
          path: |
            *.tar.gz
            *.zip

  publish:
    name: the release page
    # A manual run builds and stops. Only a tag makes a release page.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [dist, frozen]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artefacts

      - name: gather and checksum
        run: |
          mkdir release
          find artefacts -type f \( -name '*.whl' -o -name '*.zip' \
                                  -o -name '*-x86_64.tar.gz' \) \
            -exec mv {} release/ \;
          cd release
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          # The tag's own annotation is the release notes; GitHub fills in the
          # rest from the commits since the last tag. `body` goes above both,
          # and it is the only place a Windows user is told about SmartScreen
          # before they meet it.
          generate_release_notes: true
          body: |
            ### Which file do I want?

            | you have | download |
            |---|---|
            | Windows, and you just want to run it | `wish-*-windows-x86_64.zip` |
            | Linux, and you just want to run it | `wish-*-linux-x86_64.tar.gz` |
            | Python 3.12+ and you would rather `pip install` | the `.whl` |

            The two **Source code** archives are GitHub's own and are not
            builds — you do not need them to run wish.

            ### Windows: the warning is expected

            The executable is unsigned, so Windows will show **"Windows
            protected your PC"**. Click **More info**, then **Run anyway**. A
            code-signing certificate costs money and SmartScreen warns on new
            signatures anyway, so this is not going away.

            ### One command

            `wish` opens the window. `wish export SAVE.D64 -o party.yaml` and
            `wish import party.yaml -o NEW.D64` are the save editor, in the
            same executable. On Windows the build is windowed and never opens
            a console, so the subcommands print only where a terminal
            redirects them.

            ### Checksums

            `SHA256SUMS` covers every file above. `sha256sum -c SHA256SUMS` on
            Linux, `Get-FileHash` on Windows.

  pypi:
    name: PyPI
    # Tags only, and only after the release page exists -- a failed upload
    # should not leave a half-made release behind it.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [publish]
    runs-on: ubuntu-latest
    # Trusted Publishing: PyPI accepts a short-lived OIDC token minted by this
    # workflow, so there is no API token in the repository to leak or rotate.
    # The environment name is half of what PyPI matches on; the other half is
    # the workflow file name.
    environment:
      name: pypi
      url: https://pypi.org/p/wish-goldbox
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
