name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  dist:
    name: wheel and sdist
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install build
      - run: python -m build

      - name: the version is the tag
        run: python -c "import glob,sys; v='${{ github.ref_name }}'[1:]; f=glob.glob('dist/*.whl')[0]; sys.exit(0 if f.split('-')[1] == v else f'{f} is not version {v}')"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  frozen:
    name: ${{ matrix.label }} build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux
          - os: windows-latest
            label: windows

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Qt's system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libglib2.0-0

      # The editable install is what writes wish/_version.py from the tag, and
      # that file is how the frozen build knows what it is.
      - run: pip install -e ".[gui]" pyinstaller

      - run: pyinstaller --noconfirm wish.spec

      - name: name it after the tag
        shell: bash
        run: echo "NAME=wish-${GITHUB_REF_NAME#v}-${{ matrix.label }}-x86_64" >> "$GITHUB_ENV"

      - name: tar.gz
        if: runner.os == 'Linux'
        run: |
          mv dist/wish "dist/$NAME"
          tar -C dist -czf "$NAME.tar.gz" "$NAME"

      - name: zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Move-Item dist/wish "dist/$env:NAME"
          Compress-Archive -Path "dist/$env:NAME" -DestinationPath "$env:NAME.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: frozen-${{ matrix.label }}
          path: |
            *.tar.gz
            *.zip

  publish:
    name: the release page
    needs: [dist, frozen]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artefacts

      - name: gather and checksum
        run: |
          mkdir release
          find artefacts -type f \( -name '*.whl' -o -name '*.tar.gz' -o -name '*.zip' \) \
            -exec mv {} release/ \;
          cd release
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          # The tag's own annotation is the release notes; GitHub fills in the
          # rest from the commits since the last tag.
          generate_release_notes: true
