name: lint

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: lint-${{ github.event_name }}-${{ github.ref_type == 'branch' && github.ref != 'refs/heads/main' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.ref_type == 'branch' && github.ref != 'refs/heads/main' }}

jobs:
  ruff:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install ruff

      # The rule set is in pyproject.toml: pyflakes and the import rules only.
      - run: ruff check --output-format=github .
