[project]
name = "por-tools"
version = "0.1.0"
description = "Reverse engineering tools and character editor for Pool of Radiance (Commodore 64)"
requires-python = ">=3.12"
# por/yaml_io.py reads and writes the party export.
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
gui = ["PyQt6>=6.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Only the library and the app ship. tools/ is discovery scaffolding.
packages = ["por", "editor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
