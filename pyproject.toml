[project]
# `wish` was taken on PyPI by an unrelated 2013 package. The command is still
# `wish`; only the distribution is spelled differently.
name = "wish-goldbox"
dynamic = ["version"]
description = "Save editor and live automapper for the Commodore 64 Gold Box games"
requires-python = ">=3.12"
# GPL-3.0: PyQt6 is GPL, and linking against it makes this GPL too.
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
# goldbox/yaml_io.py reads and writes the party export.
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-xdist>=3.5"]
gui = ["PyQt6>=6.6"]
# The live automapper reads a running VICE; it needs the GUI extra.
automap = ["PyQt6>=6.6"]

# One command, and only one. The window, `wish export` and `wish import` are
# all reached through it -- docs/129-one-binary.md. `wish-cli`, `wish-editor`
# and `wish-automap` were dropped there; `wish --tab editor` is what the last
# two did.
[project.scripts]
wish = "wish.__main__:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# The version is the git tag: `v0.2.0` becomes 0.2.0, and an untagged
# commit gets a development version rather than claiming to be a release.
[tool.hatch.version]
source = "vcs"
# Only `v*` tags name a release. Without the match the backup tags in this
# repository's history ("purge-backup-2026") get read as versions.
raw-options = { tag_regex = "^v(?P<version>[0-9].*)$", git_describe_command = [
    "git", "describe", "--dirty", "--tags", "--long", "--match", "v[0-9]*"] }
fallback-version = "0.0.0"

[tool.hatch.build.hooks.vcs]
# Written at build time so a frozen build knows its version with no git
# and no installed metadata to ask.
version-file = "wish/_version.py"

[tool.hatch.build.targets.wheel]
# The library, the editor, the automapper and the window that hosts them both
# ship. The automapper stays its own package because the editor is a file tool
# with no emulator dependency and must stay that way -- `wish` may import both,
# `editor` imports neither.
#
# tools/ is discovery scaffolding but ships anyway, because `wish` reaches into
# it twice: `tools.wish` is the body of the `export` and `import` subcommands,
# and the window imports `tools.genui` at startup. Without it both were broken
# in an installed wheel.
packages = ["goldbox", "editor", "automap", "wish", "tools", "ui"]

# The desktop entry and the icon, so a Linux desktop can match the window to
# them and draw the pentagram in Alt-Tab rather than a generic gear.
#
# These land in `<prefix>/share`, which the desktop searches **only for some
# ways of installing**: `pip install --user` puts them in `~/.local/share` and
# a system-wide install in `/usr/local/share`, both of which are on the search
# path, while a virtualenv or a `pipx` install puts them somewhere that is
# not. `tools/installdesktop.py` is what covers those, and `wish` runs it
# itself on first start when nothing is found -- see `#9 (Finish the packaging
# icons: .desktop, .icns and a README lockup)`.
#
# The icon shipped here is the scalable one. Every current desktop reads
# `hicolor/scalable`, and one file beats eight rendered sizes that would have
# to be regenerated whenever the artist delivers again.
[tool.hatch.build.targets.wheel.shared-data]
"assets/wish.desktop" = "share/applications/wish.desktop"
"assets/logo/mark.svg" = "share/icons/hicolor/scalable/apps/wish.svg"

[tool.pytest.ini_options]
testpaths = ["tests"]
# The suite is overwhelmingly independent test files, so parallel is the
# normal way to run it -- about 7:00 sequential on twelve cores, and pushing
# often depends on that being cheap. `--dist loadgroup` keeps every test
# carrying `@pytest.mark.xdist_group` in its own worker instead of scattering
# it, which is how the emulator-pool tests (`tests/test_instance.py`,
# `tests/test_dosbox.py`, `tests/test_dosboxx.py`, `tests/test_walkrun.py`)
# stay safe: several of them claim a synthetic display band by a fixed
# number, and two workers claiming the same band race each other. `-n 0`
# on the command line disables this for a single debugging run.
addopts = "-n auto --dist loadgroup"

[tool.ruff]
line-length = 88
# pyuic6 writes it; ruff's opinion of the result is nobody's business.
extend-exclude = ["*/ui_*.py"]

[tool.ruff.lint]
# Pyflakes and the import rules, which are the two that catch real mistakes
# here -- an undefined name, an import that no longer resolves, a block that
# has drifted out of order. Deliberately NOT E501: `goldbox/layout.py` is the field
# documentation and its notes are meant to be read, not wrapped to 88 columns.
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402"]
